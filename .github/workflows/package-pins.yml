name: Package pins

# Runs only when dependency manifests change, so the pin check is scoped to PRs
# that actually update packages rather than every PR.
on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  package-pins:
    name: Package pins
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run check:package-pins
