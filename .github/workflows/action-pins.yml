name: Action pins

# Runs only when workflow or composite-action files change, so the pin check is
# scoped to PRs that actually touch GitHub Actions definitions.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/check-action-pins.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/check-action-pins.mjs"

permissions:
  contents: read

jobs:
  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run with node directly (no composite setup) so the check does not depend
      # on the very actions it validates.
      - run: node scripts/check-action-pins.mjs
