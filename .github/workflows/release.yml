name: Release

# semantic-release on every push to main, run by the fleet's shared workflow
# (rmartz/semantic-release-ci): computes the next version from the Conventional
# Commit history, publishes @rmartz/envctl to npmjs (public), tags it, and creates
# the GitHub Release. The release toolchain (semantic-release, its plugins and the
# changelog preset) lives in semantic-release-ci, where a toolchain bump is tested
# before it reaches this pin; the options stay here in .releaserc.json.
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/envctl — npm validates the calling workflow's filename
# — so there is no NPM_TOKEN secret. Renaming this file breaks publishing until
# the trusted publisher on npmjs is updated to match. Provenance attestations are
# generated automatically. OIDC publishing needs npm >= 11.5.1: the shared
# workflow runs on Node 24 (npm 11) and, because this workflow grants
# `id-token: write`, fails before tagging if npm is older.

on:
  push:
    branches: [main]

# The shared workflow declares no permissions of its own; it runs with these.
# Releases are serialized per repository inside it.
permissions:
  contents: write # create tags and GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@55b1f6145b85738f94ad87c12c9d4f41ab7818b4 # v2.0.0
    with:
      # Build dist/ before @semantic-release/npm packs it; the shared workflow
      # installs this repo's dependencies (pnpm, frozen lockfile) first.
      build-command: pnpm build
