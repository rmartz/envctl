name: Release

# semantic-release on every push to main: computes the next version from the
# Conventional Commit history, publishes @rmartz/envctl to npmjs (public), tags
# it, and creates the GitHub Release.
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/envctl, so there is no NPM_TOKEN secret. Renaming
# this file breaks publishing until the trusted publisher on npmjs is updated to
# match. Provenance attestations are generated automatically.

on:
  push:
    branches: [main]

# Serialize releases so two pushes can't publish concurrently.
concurrency: release

permissions:
  contents: write # create tags and GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
