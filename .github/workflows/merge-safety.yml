name: merge-safety

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  checks: write
  statuses: write # set the merge-safety commit status the merge gate relies on (rmartz/merge-safety#73)
  pull-requests: write
  contents: read
  actions: write
  packages: read

jobs:
  merge-safety:
    uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@02ba21fbaec01941c98dbf65cc69c8a220434754 # v0.13.0
    with:
      pr: ${{ inputs.pr }}
    secrets: inherit
