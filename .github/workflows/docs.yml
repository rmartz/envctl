name: Docs

# The checker validates the whole docs/ bundle on every run, so scoping it to
# docs / validator / workflow changes is sound: any add/edit/rename/delete of a
# docs page re-triggers it.
on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-docs.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run check:docs
