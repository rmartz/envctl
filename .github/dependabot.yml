version: 2
# Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
# proposing it, even with no `cooldown` configured. Third-party dependencies keep
# that default (security updates are never delayed by it). Only first-party
# actions and reusable workflows (`rmartz/*`) are exempt: they're published from
# our own repos with provenance, so the wait adds no supply-chain protection and
# only holds fixes back from the fleet.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch bumps into one PR per dependency type. Major bumps
    # outside a version-locked family match no group and are raised as individual
    # PRs, since they are the most likely to need a code change and warrant
    # isolated review.
    groups:
      # Version-locked families — sets of packages that ship on a shared version
      # line, so bumping one without the rest breaks the build. Listed first to
      # win group-assignment precedence.
      #
      # Same-scope families (all dev, or all prod) are restricted to `major`.
      # Their minor/patch bumps are already kept in lockstep by the catch-all
      # dev-dependencies / production-dependencies group (one PR per scope), so
      # only majors — which fall outside those minor/patch groups — need a family
      # group to avoid being split into standalone per-package PRs. This keeps the
      # steady minor/patch stream consolidated instead of one PR per family.
      #
      # A family that crosses the dev/prod split (js-yaml) keeps ALL update types:
      # dev-dependencies and production-dependencies are separate PRs, so only the
      # family group holds its members together for minor/patch as well.
      vitest:
        # vitest core and @vitest/* (coverage) share one version line — a
        # coverage/core mismatch fails the suite. All-dev, so major only.
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      eslint:
        # eslint + @eslint/js share a version line; typescript-eslint and globals
        # track the eslint major. All-dev, so major only.
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "globals"
        update-types:
          - "major"
      js-yaml:
        # @types/js-yaml tracks the js-yaml runtime major. Crosses dev/prod, so
        # keep ALL update types to hold runtime (prod) + types (dev) together.
        patterns:
          - "js-yaml"
          - "@types/js-yaml"
      # Split every Prettier bump into its own PR: a Prettier version change can
      # require reformatting even on a minor bump (see trip-split#114), so it
      # warrants isolated review. No update-types filter, so majors, minors, and
      # patches all land in this one group.
      # Listed first to win group-assignment precedence over the catch-all
      # dev-dependencies pattern.
      prettier:
        patterns:
          - "prettier"
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - "rmartz/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor/patch action bumps are low-risk and rarely need code changes, so
    # group them into a single PR. Major bumps match no group and are raised
    # individually, so a pending major never holds routine bumps back.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
